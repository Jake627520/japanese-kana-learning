<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日文五十音學習 App</title>
  <meta name="description" content="五十音認讀、書寫、聽音、跟讀與 JLPT 練習，離線可用。" />
  <!-- 標題用的明體。display=swap＋系統明體 fallback：離線時（本站是 PWA）
       不會卡住渲染，會直接用系統的 Songti TC／Yu Mincho／Noto Serif CJK。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#00A86B" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <!-- 標準版給 Chrome/Android；apple- 前綴是舊版 iOS Safari 才認得的，
       兩個都留：Chrome 會對只有 apple- 版本發出 deprecation 警告，
       但舊 iOS 只認 apple- 版，拿掉會讓那些裝置失去全螢幕啟動。 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="五十音" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
